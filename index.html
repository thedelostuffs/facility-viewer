<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDCJCC Facility Occupancy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .current-time {
            font-size: 1.2em;
            color: #45a049;
            margin-bottom: 5px;
        }
        
        .last-updated {
            font-size: 0.9em;
            color: #888;
            margin-top: 10px;
        }
        
        .admin-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: #888;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.8em;
            transition: all 0.3s;
        }
        
        .admin-link:hover {
            background: #444;
            color: #45a049;
        }
        
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #444;
            background: #2a2a2a;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: #45a049;
            border-color: #45a049;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #ccc;
        }
        
        .control-group input,
        .control-group select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
            font-size: 1em;
        }
        
        .floors-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .floor-container {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .floor-header {
            font-weight: bold;
            font-size: 1.3em;
            color: #45a049;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #45a049;
        }
        
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .event-item {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #45a049;
        }
        
        .event-room {
            font-weight: 600;
            font-size: 1.1em;
            color: #45a049;
            margin-bottom: 5px;
        }
        
        .event-name {
            font-size: 1em;
            color: #fff;
            margin-bottom: 5px;
        }
        
        .event-time {
            font-size: 0.9em;
            color: #888;
        }
        
        .no-events {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 40px 20px;
        }
        
        .loading {
            text-align: center;
            padding: 100px 20px;
            font-size: 1.2em;
            color: #888;
        }
        
        .error {
            background: #3a1a1a;
            border: 2px solid #d32f2f;
            border-radius: 10px;
            padding: 30px;
            margin: 50px auto;
            max-width: 600px;
            text-align: center;
        }
        
        .error h2 {
            color: #d32f2f;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loadingMessage" class="loading">Loading schedule data...</div>
        
        <div id="mainContent" style="display: none;">
            <header>
                <h1>EDCJCC Facility Occupancy</h1>
                <div class="current-time" id="currentTime"></div>
                <div class="last-updated" id="lastUpdated"></div>
            </header>
            
            <div class="controls">
                <div class="mode-toggle">
                    <button class="mode-btn active" data-mode="live">Live Mode</button>
                    <button class="mode-btn" data-mode="manual">Manual Time Selection</button>
                </div>
                
                <div id="manualControls" style="display: none;">
                    <div class="control-group">
                        <label for="dateSelect">Select Date:</label>
                        <select id="dateSelect"></select>
                    </div>
                    
                    <div class="control-group">
                        <label for="timeSlider">Time: <span id="timeDisplay">12:00 PM</span></label>
                        <input type="range" id="timeSlider" min="0" max="1439" value="720" step="15">
                    </div>
                </div>
            </div>
            
            <div class="floors-grid">
                <div class="floor-container">
                    <div class="floor-header">Lower Level</div>
                    <div class="event-list" id="lowerLevelEvents"></div>
                </div>
                
                <div class="floor-container">
                    <div class="floor-header">1st Floor</div>
                    <div class="event-list" id="floor1Events"></div>
                </div>
                
                <div class="floor-container">
                    <div class="floor-header">2nd Floor</div>
                    <div class="event-list" id="floor2Events"></div>
                </div>
                
                <div class="floor-container">
                    <div class="floor-header">3rd Floor</div>
                    <div class="event-list" id="floor3Events"></div>
                </div>
                
                <div class="floor-container">
                    <div class="floor-header">4th Floor</div>
                    <div class="event-list" id="floor4Events"></div>
                </div>
                
                <div class="floor-container">
                    <div class="floor-header">Parking Lot</div>
                    <div class="event-list" id="parkingLotEvents"></div>
                </div>
            </div>
        </div>
    </div>
    
    <a href="admin.html" class="admin-link">⚙️ Admin</a>
    
    <script>
        let scheduleData = [];
        let currentMode = 'live';
        let liveUpdateInterval;
        
        // Room to floor mapping
        const roomToFloor = {
            'Cafritz Hall': 'lowerLevel',
            'Pool': 'lowerLevel',
            'Kay Community Hall': 1,
            'Polinger Meeting Room': 1,
            'Salzberg Family Library': 1,
            '2nd Floor Art Room': 2,
            '16th Street Conference Room': 2,
            '16th Street Lobby': 2,
            'Goldman Theater': 2,
            'HAI Class Room/Kitchen': 3,
            'Q Street Lobby': 3,
            'Classroom 10 - PS Art/Babysitting': 4,
            'ECYF Playspace': 4,
            'Parenting Center': 4,
            'Parking Lot': 'parkingLot'
        };
        
        function getFloorForRoom(roomName) {
            if (roomName.toLowerCase().includes('pool')) {
                return 'lowerLevel';
            }
            if (roomName.toLowerCase().includes('parking')) {
                return 'parkingLot';
            }
            return roomToFloor[roomName];
        }
        
        // Load schedule data
        fetch('schedule-data.json?t=' + new Date().getTime())
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load schedule data');
                }
                return response.json();
            })
            .then(data => {
                scheduleData = data.events || data;
                const lastUpdated = data.lastUpdated || 'Unknown';
                
                document.getElementById('lastUpdated').textContent = 
                    `Last updated: ${lastUpdated}`;
                
                // Populate date dropdown
                populateDateDropdown();
                
                // Show main content
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
                // Initialize
                updateTimeDisplay();
                startLiveMode();
            })
            .catch(error => {
                console.error('Error loading schedule:', error);
                document.getElementById('loadingMessage').innerHTML = `
                    <div class="error">
                        <h2>⚠️ Unable to Load Schedule</h2>
                        <p>There was an error loading the schedule data.</p>
                        <p style="margin-top: 15px; font-size: 0.9em;">
                            This usually means the schedule hasn't been uploaded yet.<br>
                            Please contact the administrator.
                        </p>
                    </div>
                `;
            });
        
        function populateDateDropdown() {
            if (scheduleData.length === 0) return;
            
            // Get unique dates from schedule
            const dates = [...new Set(scheduleData.map(e => e.date))].sort();
            
            const dateSelect = document.getElementById('dateSelect');
            dateSelect.innerHTML = '';
            
            dates.forEach(dateStr => {
                const date = new Date(dateStr + 'T00:00:00');
                const option = document.createElement('option');
                option.value = dateStr;
                option.textContent = date.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                dateSelect.appendChild(option);
            });
        }
        
        // Mode toggle
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentMode = btn.dataset.mode;
                    
                    if (currentMode === 'live') {
                        document.getElementById('manualControls').style.display = 'none';
                        startLiveMode();
                    } else {
                        document.getElementById('manualControls').style.display = 'block';
                        stopLiveMode();
                        updateManualView();
                    }
                });
            });
            
            const timeSlider = document.getElementById('timeSlider');
            timeSlider.addEventListener('input', () => {
                updateTimeDisplay();
                updateManualView();
            });
            
            document.getElementById('dateSelect').addEventListener('change', updateManualView);
        });
        
        function updateTimeDisplay() {
            const minutes = parseInt(document.getElementById('timeSlider').value);
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            const period = hours >= 12 ? 'PM' : 'AM';
            const displayHour = hours === 0 ? 12 : hours > 12 ? hours - 12 : hours;
            document.getElementById('timeDisplay').textContent = 
                `${displayHour}:${mins.toString().padStart(2, '0')} ${period}`;
        }
        
        function startLiveMode() {
            updateLiveView();
            liveUpdateInterval = setInterval(updateLiveView, 30000);
        }
        
        function stopLiveMode() {
            if (liveUpdateInterval) {
                clearInterval(liveUpdateInterval);
            }
        }
        
        function updateLiveView() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            const activeEvents = getActiveEventsAt(now);
            displayEvents(activeEvents);
        }
        
        function updateManualView() {
            const selectedDate = document.getElementById('dateSelect').value;
            const minutes = parseInt(document.getElementById('timeSlider').value);
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            
            const datetime = new Date(`${selectedDate}T${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:00`);
            
            document.getElementById('currentTime').textContent = datetime.toLocaleString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            const activeEvents = getActiveEventsAt(datetime);
            displayEvents(activeEvents);
        }
        
        function getActiveEventsAt(datetime) {
            // Use local date, not UTC (fixes timezone bug)
            const year = datetime.getFullYear();
            const month = String(datetime.getMonth() + 1).padStart(2, '0');
            const day = String(datetime.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            
            const currentMinutes = datetime.getHours() * 60 + datetime.getMinutes();
            
            return scheduleData.filter(event => {
                if (event.date !== dateStr) return false;
                
                const [hours, minutes] = event.time.split(':').map(Number);
                const eventStartMinutes = hours * 60 + minutes;
                const eventEndMinutes = eventStartMinutes + event.duration;
                
                return currentMinutes >= eventStartMinutes && currentMinutes < eventEndMinutes;
            });
        }
        
        function displayEvents(activeEvents) {
            const eventsByFloor = {lowerLevel: [], 1: [], 2: [], 3: [], 4: [], parkingLot: []};
            
            activeEvents.forEach(event => {
                const floor = getFloorForRoom(event.room);
                if (floor && eventsByFloor[floor] !== undefined) {
                    eventsByFloor[floor].push(event);
                }
            });
            
            displayFloorEvents('lowerLevelEvents', eventsByFloor.lowerLevel);
            
            for (let floor = 1; floor <= 4; floor++) {
                displayFloorEvents(`floor${floor}Events`, eventsByFloor[floor]);
            }
            
            displayFloorEvents('parkingLotEvents', eventsByFloor.parkingLot);
        }
        
        function displayFloorEvents(containerId, events) {
            const container = document.getElementById(containerId);
            
            if (events.length === 0) {
                container.innerHTML = '<div class="no-events">No events currently active</div>';
            } else {
                container.innerHTML = events.map(event => {
                    const [hours, minutes] = event.time.split(':').map(Number);
                    const endMinutes = hours * 60 + minutes + event.duration;
                    const endHours = Math.floor(endMinutes / 60) % 24;
                    const endMins = endMinutes % 60;
                    
                    const startTime = formatTime(hours, minutes);
                    const endTime = formatTime(endHours, endMins);
                    
                    return `
                        <div class="event-item">
                            <div class="event-room">${event.room}</div>
                            <div class="event-name">${event.event}</div>
                            <div class="event-time">${startTime} - ${endTime}</div>
                        </div>
                    `;
                }).join('');
            }
        }
        
        function formatTime(hours, minutes) {
            const period = hours >= 12 ? 'PM' : 'AM';
            const displayHour = hours === 0 ? 12 : hours > 12 ? hours - 12 : hours;
            return `${displayHour}:${minutes.toString().padStart(2, '0')} ${period}`;
        }
    </script>
</body>
</html>
